<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Formation</title>
</head>

<body>
    <h1>{% if formation %}Modify Formation{% else %}Create Formation{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="formation_name">Name:</label>
        <input type="text" id="formation_name" name="formation_name" value="{{ formation.formation_name|default:'' }}"
            required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required>{{ formation.description|default:'' }}</textarea><br><br>

        <label for="duration">Duration:</label>
        <input type="number" id="duration" name="duration" value="{{ formation.duration|default:'' }}" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
